<!DOCTYPE html>
<html lang="he" dir="rtl"><!-- Initial direction; I18nProvider updates on load per stored preference -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holistic Fitness OS</title>
    <meta name="description" content="אפליקציה הוליסטית למתחם כושר - אימונים, תזונה, מנטלי, שיקום, והתקדמות" />
    <meta name="theme-color" content="#c8a84b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Holistic FIT" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c8a84b'/><text y='.9em' font-size='60' x='18' fill='%230d0d14' font-weight='900'>H</text></svg>"/>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='90' fill='%23c8a84b'/><text y='.87em' font-size='340' x='90' fill='%230d0d14' font-weight='900'>H</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Heebo', 'Segoe UI', sans-serif; direction: rtl; }
      #root { min-height: 100vh; }
      input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: #e8e3d8; border-radius: 2px; outline: none; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #c8a84b; cursor: pointer; }
      select { appearance: none; -webkit-appearance: none; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 2px; }

      /* Suppress Chrome/Safari autofill styling that overrides our dark inputs.
         Without this, saved emails render on WHITE background with red hints
         and a stray '{}' autofill glyph — which looked like a real error. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #1a1a24 inset !important;
        -webkit-text-fill-color: #e8e3d8 !important;
        caret-color: #c8a84b;
        transition: background-color 5000s ease-in-out 0s !important;
      }
      /* Chrome on Android sometimes injects a data-list arrow / autofill icon
         that renders as a small '{}' glyph. Hide it. */
      input::-webkit-list-button,
      input::-webkit-calendar-picker-indicator,
      input::-webkit-inner-spin-button { display: none !important; opacity: 0; }
      input::-webkit-contacts-auto-fill-button,
      input::-webkit-credentials-auto-fill-button { visibility: hidden !important; display: none !important; pointer-events: none !important; position: absolute !important; right: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
